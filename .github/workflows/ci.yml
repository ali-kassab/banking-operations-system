# Builds and tests the backend and the frontend on every push and pull request.
# No secrets and no deployment: the backend tests use in-memory SQLite, so no SQL Server is needed.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Banking.sln

      - name: Build (warnings are errors)
        run: dotnet build Banking.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Banking.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (Angular build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/banking-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/banking-client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
