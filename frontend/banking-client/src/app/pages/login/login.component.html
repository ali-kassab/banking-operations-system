<div class="login-page">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>🏦 Banking Ops</h1>
    <p class="muted">Sign in with your employee account.</p>

    <label>
      Username
      <input formControlName="username" autocomplete="username" />
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="hint">
      Development accounts: <code>admin / Admin&#64;123</code> or <code>employee / Employee&#64;123</code>
    </p>
  </form>
</div>
